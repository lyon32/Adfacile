# ═══════════════════════════════════════════════════════════════
# AdsFacile - Docker Compose DÉVELOPPEMENT
# Lance tout le stack local avec: docker compose -f docker-compose.dev.yml up --build
# ═══════════════════════════════════════════════════════════════

services:
  # ── Backend Node.js (avec hot reload via nodemon) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: adsfacile-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    volumes:
      # Monte le code source pour hot reload
      - ./backend/src:/app/src
    restart: unless-stopped
    networks:
      - adsfacile-net

  # ── Frontend React (Vite dev server avec hot reload) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: adsfacile-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      # Monte le code source pour hot reload
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - adsfacile-net

networks:
  adsfacile-net:
    driver: bridge
