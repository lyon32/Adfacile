# ═══════════════════════════════════════════════════════════════
# AdsFacile - Docker Compose DÉVELOPPEMENT
# Lance tout le stack local avec: docker compose -f docker-compose.dev.yml up
# ═══════════════════════════════════════════════════════════════

services:
  # ── Backend Node.js (avec hot reload) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsfacile-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    volumes:
      # Monte le code source pour hot reload
      - ./backend/src:/app/src
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - adsfacile-net

  # ── Frontend React (Vite dev server) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adsfacile-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - adsfacile-net

  # ── Redis (cache & rate limiting) ──
  redis:
    image: redis:7-alpine
    container_name: adsfacile-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - adsfacile-net

volumes:
  redis-data:

networks:
  adsfacile-net:
    driver: bridge
