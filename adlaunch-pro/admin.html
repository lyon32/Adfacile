<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdLaunch Pro - Administration</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="chatbot.css">
</head>
    <style>
        :root {
            --admin-bg: #f0f2f5;
            --admin-sidebar: #1a1c23;
            --admin-primary: #6366f1;
            --admin-secondary: #4f46e5;
            --admin-text-main: #111827;
            --admin-text-muted: #6b7280;
            --admin-white: #ffffff;
            --admin-border: #e5e7eb;
        }

        body {
            background-color: var(--admin-bg);
            color: var(--admin-text-main);
            overflow-x: hidden;
        }

        .admin-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 280px;
            background-color: var(--admin-sidebar);
            color: white;
            padding: var(--spacing-xl);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .sidebar-brand {
            font-size: var(--font-size-xl);
            font-weight: 800;
            margin-bottom: var(--spacing-2xl);
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--admin-white);
        }

        .admin-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            flex-grow: 1;
        }

        .nav-item {
            margin-bottom: var(--spacing-xs);
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: var(--spacing-md) var(--spacing-lg);
            color: #9ca3af;
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: all 0.2s;
            gap: 12px;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-link.active {
            background-color: var(--admin-primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Main Content */
        .admin-content {
            flex-grow: 1;
            margin-left: 280px;
            padding: var(--spacing-2xl);
            min-width: 0; /* Important for flex child in table layouts */
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-2xl);
        }

        .page-title h1 {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page-title p {
            color: var(--admin-text-muted);
            font-size: var(--font-size-sm);
        }

        /* Stats Blocks */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
        }

        .stat-card {
            background: var(--admin-white);
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-card .label {
            color: var(--admin-text-muted);
            font-size: var(--font-size-sm);
            font-weight: 600;
        }

        .stat-card .value {
            font-size: var(--font-size-3xl);
            font-weight: 800;
            color: var(--admin-text-main);
        }

        /* Tables & Lists */
        .content-card {
            background: var(--admin-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--admin-border);
        }

        .card-header h2 {
            font-size: var(--font-size-lg);
            font-weight: 700;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .admin-table th {
            padding: var(--spacing-md);
            font-weight: 600;
            color: var(--admin-text-muted);
            font-size: var(--font-size-xs);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--admin-border);
        }

        .admin-table td {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--admin-border);
            vertical-align: middle;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--gradient-primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-admin { background-color: #fef2f2; color: #991b1b; }
        .status-user { background-color: #f0fdf4; color: #166534; }
        .status-completed { background-color: #f0fdf4; color: #166534; }
        .status-pending { background-color: #fffbeb; color: #92400e; }

        .online-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .online-indicator.online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .online-indicator.offline { background-color: #9ca3af; }

        .search-container {
            position: relative;
            margin-right: var(--spacing-md);
        }
        .search-input {
            padding: 8px 12px 8px 36px;
            border-radius: var(--radius-md);
            border: 1px solid var(--admin-border);
            font-size: var(--font-size-sm);
            width: 250px;
            transition: all 0.2s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            width: 300px;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--admin-text-muted);
            pointer-events: none;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--admin-border);
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--admin-bg);
        }

        .section-view {
            display: none;
        }

        .section-view.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .admin-sidebar {
                width: 80px;
                padding: var(--spacing-md);
            }
            .sidebar-brand span, .nav-link span:last-child {
                display: none;
            }
            .admin-content {
                margin-left: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-brand">
                <span style="font-size: 24px;">🚀</span>
                <span>AdLaunch Admin</span>
            </div>

            <nav class="admin-nav">
                <div class="nav-item">
                    <a href="#" class="nav-link active" data-view="users">
                        <span>👥</span>
                        <span>Utilisateurs</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="#" class="nav-link" data-view="logs" style="opacity: 0.5; pointer-events: none;">
                        <span>📋</span>
                        <span>Logs Système</span>
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer" style="padding-top: var(--spacing-lg); border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="dashboard.html" class="nav-link" style="margin-bottom: 10px;">
                    <span>🏠</span>
                    <span>Vue Client</span>
                </a>
                <button class="btn btn-secondary" style="width: 100%; border: none; background: rgba(255,255,255,0.1);" onclick="logout()">
                    Déconnexion
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="top-bar">
                <div class="page-title">
                    <h1 id="view-title">Gestion des Utilisateurs</h1>
                    <p id="view-desc">Aperçu et contrôle des comptes de la plateforme</p>
                </div>
                <div class="admin-profile" style="display: flex; align-items: center; gap: 10px;">
                    <span id="admin-name-display" style="font-weight: 600;">Admin</span>
                    <div class="user-avatar" id="admin-avatar-display" style="width: 40px; height: 40px; border-radius: 50%; background: var(--admin-primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;">A</div>
                </div>
            </div>

            <!-- Users View -->
            <div id="users-view" class="section-view active">
                <div class="stats-container">
                    <div class="stat-card">
                        <span class="label">Utilisateurs Totaux</span>
                        <span class="value" id="count-total-users">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Nouveaux ce mois</span>
                        <span class="value" id="count-new-users">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Nouveaux cette année</span>
                        <span class="value" id="count-year-users">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">En Ligne</span>
                        <span class="value" id="count-online-users">0</span>
                    </div>
                </div>

                <div class="content-card">
                    <div class="card-header">
                        <h2>Répertoire des Utilisateurs</h2>
                        <div class="card-actions" style="display: flex; align-items: center;">
                            <div class="search-container">
                                <span class="search-icon">🔍</span>
                                <input type="text" id="user-search" class="search-input" placeholder="Rechercher un utilisateur (nom, email...)" oninput="filterUsers()">
                            </div>
                            <button class="btn btn-secondary btn-sm" onclick="loadUsers()">Actualiser</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Identité</th>
                                    <th>Rôle</th>
                                    <th>Téléphone</th>
                                    <th>Inscription</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="user-rows">
                                <!-- JS Populated -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="utils.js"></script>
    <script src="admin.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
