      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentProof' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/tickets/{ticketId}/messages:
    parameters: [ { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [ Administration ]
      operationId: adminReplyTicket
      summary: Répondre (dans l'application et par e-mail)
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TicketMessageCreate' } } }
      responses:
        '201': { description: Envoyé, content: { application/json: { schema: { $ref: '#/components/schemas/TicketMessage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/media-models/{modelId}:
    parameters: [ { name: modelId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+:[a-z0-9./_-]+$' } } ]
    put:
      tags: [ Administration ]
      operationId: adminPutMediaModel
      summary: Créer ou modifier un modèle du catalogue (statut, fiche, niveaux, crédits)
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminMediaModel' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AdminMediaModel' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/routing-rules/{capability}:
    parameters: [ { name: capability, in: path, required: true, schema: { $ref: '#/components/schemas/Capability' } } ]
    put:
      tags: [ Administration ]
      operationId: adminPutRoutingRule
      summary: Modèle principal, secours, attente maximale
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoutingRule' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RoutingRule' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/settings/{key}:
    parameters: [ { name: key, in: path, required: true, schema: { type: string, enum: [ maintenance, credit_price_xaf, image_margin_threshold_xaf, trial, session_idle_minutes, login_lock, referral_bonus_credits, daily_generation_cap ] } } ]
    put:
      tags: [ Administration ]
      operationId: adminPutSetting
      summary: Modifier un paramètre (dont le mode maintenance)
      security: [ { sessionCookie: [] } ]
      requestBody: { required: true, content: { application/json: { schema: {} } } }
      responses:
        '204': { description: Enregistré et journalisé }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/vat-rates/{countryCode}:
    parameters: [ { name: countryCode, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{2}$' } } ]
    put:
      tags: [ Administration ]
      operationId: adminPutVatRate
      summary: Fixer la TVA d'un pays
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ rate, valid_from ], properties: { rate: { type: number, minimum: 0, maximum: 0.5 }, valid_from: { type: string, format: date }, source_url: { type: string, format: uri } } } } }
      responses:
        '204': { description: Enregistré }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/audit-log:
    get:
      tags: [ Administration ]
      operationId: adminAuditLog
      summary: Journal des actions d'administration
      security: [ { sessionCookie: [] } ]
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }, next_cursor: { type: [ string, 'null' ] } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/costs:
    get:
      tags: [ Administration ]
      operationId: adminCosts
      summary: Coûts IA et marges (par utilisateur, agent, modèle, fournisseur) et temps d'attente
      security: [ { sessionCookie: [] } ]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
        - { name: group_by, in: query, required: true, schema: { type: string, enum: [ workspace, agent, model, provider ] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { type: object, additionalProperties: true } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: Session Supabase en cookie HttpOnly, Secure, SameSite=Lax (application web). Les requêtes qui modifient des données exigent aussi une origine Pubeka (contrôle Origin) — protection CSRF.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès Supabase (application mobile V3 et outils). Les routes /admin exigent un jeton de niveau aal2 (double vérification).
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: Signature HMAC propre à chaque fournisseur (SasPay, Meta X-Hub-Signature-256, fal, Higgsfield, BytePlus, Resend/Svix), vérifiée avant tout traitement.

  parameters:
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    PageId: { name: pageId, in: path, required: true, schema: { type: string, format: uuid } }
    CampaignId: { name: campaignId, in: path, required: true, schema: { type: string, format: uuid } }
    GenerationId: { name: generationId, in: path, required: true, schema: { type: string, format: uuid } }
    VisualId: { name: visualId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 généré par le client pour cette intention. Même clé + même corps = même réponse ; même clé + corps différent = 409.
      schema: { type: string, format: uuid }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string, maxLength: 200 } }

  responses:
    BadRequest: { description: Requête mal formée ou champs invalides, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: "Non connecté, session expirée ou signature de webhook invalide", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PaymentRequired: { description: "Crédits, quota ou formule insuffisants", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: "Connecté mais pas autorisé (rôle, lecture seule, espace suspendu)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Introuvable — aussi renvoyé pour une ressource d'un autre espace et pour /admin sans droits, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: "Conflit d'état (déjà publiée, déjà annulée, clé d'idempotence réutilisée…)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Gone: { description: "Ressource expirée (fichier supprimé après 7 jours, invitation expirée)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PayloadTooLarge: { description: Fichier trop lourd, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    UnsupportedMediaType: { description: Type de fichier refusé, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: Valide mais impossible (règle métier), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    FailedDependency: { description: "Prérequis plateforme manquant (moyen de paiement Meta, jeton expiré)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooManyRequests: { description: Trop de requêtes ou plafond quotidien atteint, headers: { Retry-After: { schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    BadGateway: { description: "Erreur d'un service externe (Meta, SasPay, IA)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ServiceUnavailable: { description: Maintenance ou fournisseur indisponible, headers: { Retry-After: { schema: { type: integer } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    # ---------- Erreurs
    Problem:
      type: object
      description: Format d'erreur unique (RFC 9457 Problem Details) + extensions Pubeka.
      required: [ type, title, status, code, request_id ]
      properties:
        type: { type: string, format: uri, examples: [ 'https://pubeka.com/errors/insufficient-credits' ] }
        title: { type: string, description: "Résumé court, en anglais, stable" }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: "Message pour l'utilisateur, dans sa langue (fr/en)" }
        instance: { type: string, description: Chemin de la requête }
        code: { $ref: '#/components/schemas/ErrorCode' }
        request_id: { type: string, description: Identifiant à communiquer au support (Sentry) }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        retry_after_s: { type: integer }
        meta: { type: object, additionalProperties: true, description: 'Données utiles (ex. credits_missing, upgrade_to)' }
      additionalProperties: false
    FieldError:
      type: object
      required: [ field, code, message ]
      properties:
        field: { type: string, examples: [ 'copy.primary_text' ] }
        code: { type: string, examples: [ too_long, required, invalid_format ] }
        message: { type: string }
    ErrorCode:
      type: string
      enum:
        - validation_failed
        - unauthenticated
        - session_expired
        - mfa_required
        - forbidden
        - role_insufficient
        - workspace_read_only
        - workspace_suspended
        - not_found
        - conflict
        - idempotency_key_reused
        - already_published
        - gone
        - file_too_large
        - unsupported_file_type
        - insufficient_credits
        - campaign_quota_reached
        - page_limit_reached
        - member_limit_reached
        - plan_feature_locked
        - trial_already_used
        - illegal_product
        - source_unreadable
        - unsafe_url
        - meta_not_connected
        - meta_token_expired
        - meta_payment_method_missing
        - meta_error
        - budget_too_low
        - rate_limited
        - daily_generation_cap
        - provider_unavailable
        - payment_provider_error
        - webhook_signature_invalid
        - maintenance
        - internal_error

    # ---------- Public
    Maintenance:
      type: object
      required: [ active ]
      properties: { active: { type: boolean }, message: { type: [ string, 'null' ] } }
    Plan:
      type: object
      required: [ code, price_xaf, monthly_credits, campaigns_per_period, max_pages, max_members ]
      properties:
        code: { type: string, enum: [ starter, pro, business ] }
        price_xaf: { type: integer }
        monthly_credits: { type: integer }
        campaigns_per_period: { type: integer }
        max_pages: { type: integer }
        max_members: { type: integer }
        features: { type: object, additionalProperties: { type: boolean } }
    FxRate:
      type: object
      required: [ base, quote, rate, fetched_at ]
      properties:
        base: { type: string, const: USD }
        quote: { type: string, pattern: '^[A-Z]{3}$', description: "Code ISO 4217 de la monnaie locale (une des monnaies des 54 pays d'Afrique)" }
        rate: { type: number, description: Unités de la monnaie locale pour 1 dollar }
        source: { type: string, enum: [ saspay, fallback, manual, exchangerate-api ] }
        fetched_at: { type: string, format: date-time }
    Money:
      type: object
      description: |
        Montant en monnaie locale avec l'équivalent en dollars. `local_minor` est exprimé dans l'unité mineure de `currency`
        (exposant ISO 4217 : 0 décimale pour le FCFA, 2 pour le naira, 3 pour le dinar tunisien) : 5250000 NGN = 52 500,00 NGN.
      required: [ local_minor, usd_cents, currency ]
      properties: { local_minor: { type: integer }, usd_cents: { type: integer }, currency: { type: string, pattern: '^[A-Z]{3}$' } }

    # ---------- Compte et espaces
    Me:
      type: object
      required: [ id, email, ui_language, timezone, currency_display ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: [ string, 'null' ] }
        last_name: { type: [ string, 'null' ] }
        phone: { type: [ string, 'null' ], pattern: '^\+[1-9][0-9]{6,14}$' }
        ui_language: { type: string, enum: [ fr, en ] }
        country_code: { type: [ string, 'null' ], pattern: '^[A-Z]{2}$' }
        city: { type: [ string, 'null' ] }
        timezone: { type: string }
        currency_display: { type: string, pattern: '^[A-Z]{3}$', description: "Code ISO 4217 de la monnaie d'affichage (celle du pays, ou XAF / XOF pour la zone franc CFA)" }
        theme: { type: string, enum: [ light, dark, system ] }
        greeting: { type: string, enum: [ bonjour, bonsoir, hello, good_evening ], description: Calculé selon l'heure locale }
    MeUpdate:
      type: object
      additionalProperties: false
      properties:
        first_name: { type: string, maxLength: 80 }
        last_name: { type: string, maxLength: 80 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }
        ui_language: { type: string, enum: [ fr, en ] }
        country_code: { type: string, pattern: '^[A-Z]{2}$' }
        city: { type: string, maxLength: 120 }
        currency_display: { type: string, pattern: '^[A-Z]{3}$', description: "Code ISO 4217 de la monnaie d'affichage (celle du pays, ou XAF / XOF pour la zone franc CFA)" }
        theme: { type: string, enum: [ light, dark, system ] }
    Workspace:
      type: object
      required: [ id, name, status, role, plan ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ active, read_only, suspended ] }
        role: { type: string, enum: [ owner, editor, viewer ] }
        plan: { type: string, enum: [ trial, starter, pro, business ], description: "Formule de l'abonnement le plus récent ; `trial` pendant l'essai et tant qu'aucune formule n'a été choisie (limites de Starter)" }
        period_end: { type: [ string, 'null' ], format: date-time }
        grace_until: { type: [ string, 'null' ], format: date-time }
        quotas: { $ref: '#/components/schemas/Quotas' }
    Quotas:
      type: object
      properties:
        campaigns_used: { type: integer }
        campaigns_limit: { type: integer }
        pages_active: { type: integer }
        pages_limit: { type: integer }
        members: { type: integer }
        members_limit: { type: integer }
        credits_available: { type: integer }
    Member:
      type: object
      required: [ profile_id, role ]
      properties:
        profile_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [ owner, editor, viewer ] }
        joined_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [ id, email, role, expires_at ]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ editor, viewer ] }
        expires_at: { type: string, format: date-time }

    # ---------- Meta
    MetaConnection:
      type: object
      required: [ id, token_type, status ]
      properties:
        id: { type: string, format: uuid }
        token_type: { type: string, enum: [ system_user, user ] }
        status: { type: string, enum: [ ok, expiring, expired, revoked ] }
        expires_at: { type: [ string, 'null' ], format: date-time }
        business_id: { type: [ string, 'null' ] }
        last_health_check: { oneOf: [ { $ref: '#/components/schemas/HealthCheck' }, { type: 'null' } ] }
    MetaConnectRequest:
      type: object
      additionalProperties: false
      properties:
        return_to: { type: string, enum: [ onboarding, settings ], default: settings, description: "Écran où revenir après Facebook : /bienvenue/meta ou /reglages/comptes-meta" }
    HealthCheck:
      type: object
      required: [ items ]
      properties:
        checked_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            required: [ key, ok ]
            properties:
              key: { type: string, enum: [ business_portfolio, ad_account, payment_method, page, instagram, whatsapp, pixel, permissions ] }
              ok: { type: boolean }
              required: { type: boolean, description: "Bloque la suite si rouge (seul le compte publicitaire)" }
              recommended: { type: boolean, description: "Fortement recommandé (WhatsApp) : bandeau orange si rouge" }
              guide_slug: { type: string }
    Page:
      type: object
      required: [ id, meta_page_id, name, active ]
      properties:
        id: { type: string, format: uuid }
        meta_page_id: { type: string }
        name: { type: string }
        active: { type: boolean }
        locked_for_period: { type: boolean }
        instagram_linked: { type: boolean }
        whatsapp_linked: { type: boolean }
        ad_language: { type: string, enum: [ fr, en ] }
        ad_address: { type: string, enum: [ vous, tu ] }
    PageUpdate:
      type: object
      additionalProperties: false
      properties:
        active: { type: boolean }
        ad_language: { type: string, enum: [ fr, en ] }
        ad_address: { type: string, enum: [ vous, tu ] }
    AdAccount:
      type: object
      required: [ id, meta_ad_account_id, is_active ]
      properties:
        id: { type: string, format: uuid }
        meta_ad_account_id: { type: string, pattern: '^act_[0-9]+$' }
        name: { type: string }
        currency: { type: string }
        has_payment_method: { type: [ boolean, 'null' ] }
        is_active: { type: boolean }
    BrandKit:
      type: object
      additionalProperties: false
      properties:
        logo_path: { type: [ string, 'null' ] }
        colors: { type: object, properties: { primary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }, secondary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }, accent: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } } }
        font: { type: [ string, 'null' ], maxLength: 60 }
        phone: { type: [ string, 'null' ], pattern: '^\+[1-9][0-9]{6,14}$' }
        whatsapp: { type: [ string, 'null' ], pattern: '^\+[1-9][0-9]{6,14}$' }
        tagline: { type: [ string, 'null' ], maxLength: 120 }
        tone: { type: [ string, 'null' ], enum: [ premium, friendly, bold, serious, playful, null ] }
        show_number_on_visuals: { type: boolean }

    # ---------- Sources et analyse
    UploadRequest:
      type: object
      required: [ purpose, mime, size ]
      additionalProperties: false
      properties:
        purpose: { type: string, enum: [ source, reference, brand_logo, support_attachment, payment_proof ] }
        mime: { type: string, enum: [ image/png, image/jpeg, image/webp, application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document ] }
        size: { type: integer, minimum: 1, maximum: 20971520, description: 'Octets. Image (PNG, JPEG, WebP) : 10 Mo maximum (10485760) ; PDF et DOCX : 20 Mo maximum. Vérifié par le serveur selon le type.' }
    UploadTicket:
      type: object
      required: [ upload_url, file_path, expires_at ]
      properties:
        upload_url: { type: string, format: uri }
        file_path: { type: string }
        expires_at: { type: string, format: date-time }
    AnalysisRequest:
      type: object
      required: [ sources ]
      additionalProperties: false
      properties:
        page_id: { type: string, format: uuid }
        user_intent: { type: string, maxLength: 1000 }
        sources:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [ type ]
            additionalProperties: false
            properties:
              type: { type: string, enum: [ website, app_link, image, social_post, document, text ] }
              url: { type: string, format: uri, pattern: '^https?://', maxLength: 2048 }
              file_path: { type: string, maxLength: 300 }
              text: { type: string, maxLength: 5000 }
    Analysis:
      type: object
      required: [ id, status ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ queued, reading, analysing, questions, ready, blocked, failed ] }
        blocked_reason: { type: [ string, 'null' ], enum: [ illegal_product, null ] }
        profile: { type: [ object, 'null' ], description: BusinessProfile de l'Analyste (docs/agents/01) }
        questions: { type: array, items: { $ref: '#/components/schemas/Question' } }
        unreadable_sources: { type: array, items: { type: integer } }
        page_id: { type: [ string, 'null' ], format: uuid, description: "Page choisie à l'étape Sources ; sert à créer le brouillon de campagne." }
        error_code: { type: [ string, 'null' ], description: "Code de la liste fermée quand status = failed (ex. provider_unavailable, source_unreadable)." }
        flags: { type: array, items: { type: string }, description: "Signalements affichables : SOURCE_UNREADABLE:{index}, MODEL_WITHOUT_VISION, IMAGES_NOT_READ, IMAGE_VALUES_UNVERIFIED, MULTIPLE_BUSINESSES, PRODUCT_NOT_DETECTED. Une injection de consigne n'est jamais exposée (elle est ignorée et enregistrée pour l'administration)." }
        answers: { type: array, items: { $ref: '#/components/schemas/Answer' }, description: 'Réponses déjà données aux questions (affichées pré-remplies au retour sur l’étape).' }
    Question:
      type: object
      required: [ id, text, input, required ]
      properties:
        id: { type: string }
        field: { type: string }
        text: { type: string }
        why: { type: string }
        input: { type: string, enum: [ phone, text, single_choice, multi_choice, location, number ] }
        options: { type: [ array, 'null' ], items: { type: string } }
        required: { type: boolean }
    Answer:
      type: object
      required: [ question_id, answer ]
      properties:
        question_id: { type: string, maxLength: 20 }
        answer: { type: string, maxLength: 500 }

    # ---------- Campagnes
    CampaignStatus:
      type: string
      enum: [ draft, publishing, in_review, active, paused, rejected, ended, stopped, error ]
    Campaign:
      type: object
      required: [ id, name, platform, status, version, editable, cost ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string, enum: [ meta, google, tiktok ] }
        page_id: { type: [ string, 'null' ], format: uuid }
        analysis_id: { type: [ string, 'null' ], format: uuid }
        status: { $ref: '#/components/schemas/CampaignStatus' }
        objective: { type: [ string, 'null' ], enum: [ OUTCOME_ENGAGEMENT, OUTCOME_TRAFFIC, OUTCOME_AWARENESS, OUTCOME_SALES, null ] }
        destination: { type: [ string, 'null' ], enum: [ WHATSAPP, MESSENGER, INSTAGRAM_DIRECT, WEBSITE, APP, ON_POST, NONE, null ] }
        optimization_goal: { type: [ string, 'null' ], enum: [ CONVERSATIONS, LINK_CLICKS, LANDING_PAGE_VIEWS, POST_ENGAGEMENT, REACH, OFFSITE_CONVERSIONS, null ] }
        geo: { $ref: '#/components/schemas/CampaignGeo' }
        targeting: { $ref: '#/components/schemas/CampaignTargeting' }
        daily_budget_usd_cents: { type: [ integer, 'null' ], description: "Budget par jour en centimes de dollar (la valeur qui fait foi) ; l'équivalent en FCFA est dans cost.daily" }
        cost: { $ref: '#/components/schemas/CampaignCost' }
        start_date: { type: [ string, 'null' ], format: date }
        end_date: { type: [ string, 'null' ], format: date }
        copy: { $ref: '#/components/schemas/AdCopy' }
        tracking: { type: [ object, 'null' ], properties: { pixel_id: { type: string } } }
        visual_brief: { type: [ string, 'null' ], maxLength: 1000 }
        ab_test: { type: boolean }
        editable: { type: boolean }
        chosen_proposal_version: { type: [ integer, 'null' ] }
        status_message: { type: string, description: "Texte affiché (ex. « Meta vérifie ta pub, en général sous 24 heures »)" }
        published_at: { type: [ string, 'null' ], format: date-time }
        paused_at: { type: [ string, 'null' ], format: date-time, description: "Mise en pause par le client (« Mise en pause par toi le JJ/MM »)" }
        publication_error: { oneOf: [ { $ref: '#/components/schemas/PublicationError' }, { type: 'null' } ] }
        version: { type: integer, minimum: 1, description: Augmente à chaque modification ; à renvoyer dans PATCH (SECURITY_NOTES EC-TEAM-08) }
    PublishRequest:
      type: object
      additionalProperties: false
      required: [ accept_liability ]
      properties:
        accept_liability: { type: boolean, description: "Obligatoire à true pour la première publication de l'espace (clause de responsabilité, enregistrée avec la date et l'utilisateur) ; ignoré ensuite." }
        confirmed_total:
          type: object
          additionalProperties: false
          required: [ amount_minor, currency ]
          description: |
            Coût total affiché à l'écran, en monnaie locale. Le serveur le recalcule avec le taux du jour : si l'écart dépasse 2 %,
            `409 conflict` (`meta.reason: fx_changed`, `meta.new_total`) et l'écran redemande la confirmation (EC-CAMP-05).
          properties:
            amount_minor: { type: integer, minimum: 0 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
    RelaunchRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ mode, version ]
          properties:
            mode: { type: string, const: recover }
            version: { type: integer, minimum: 1, description: Version de la campagne lue par le client (verrou optimiste) }
        - type: object
          additionalProperties: false
          required: [ mode, visual_mode ]
          properties:
            mode: { type: string, const: copy }
            visual_mode: { type: string, enum: [ same, similar, change ] }
    PublicationError:
      type: object
      description: Pourquoi la dernière publication a échoué (affiché sur la campagne en erreur ou revenue en brouillon).
      required: [ code, at ]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        title: { type: string, description: "Titre de l'erreur de Meta, traduit" }
        message: { type: string, description: "Message de Meta, traduit en langage simple" }
        fix: { type: [ string, 'null' ], enum: [ destination, retry, reconnect, billing, null ] }
        uncertain: { type: boolean, description: "Vrai si le résultat chez Meta était incertain : la tâche a cherché la campagne chez Meta avant de conclure" }
        at: { type: string, format: date-time }
    CampaignGeo:
      type: object
      additionalProperties: false
      properties:
        countries: { type: array, maxItems: 20, items: { type: string, pattern: '^[A-Z]{2}$' } }
        cities:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [ name, radius_km ]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              radius_km: { type: integer, minimum: 1, maximum: 80 }
    CampaignTargeting:
      type: object
      additionalProperties: false
      properties:
        age_min: { type: integer, minimum: 18, maximum: 65 }
        age_max: { type: integer, minimum: 18, maximum: 65 }
        genders: { type: string, enum: [ all, male, female ] }
        advantage_plus: { type: boolean }
    CampaignCost:
      type: object
      description: |
        Coût estimé de la campagne : budget par jour × nombre de jours (début et fin inclus). Tout est calculé par le
        serveur, en entiers (centimes de dollar, unités de la monnaie locale). Aucune TVA (retirée pour le moment, décision du
        17/10/2026, à réactiver sur décision) et aucun taux de change inventé : sans taux de change valide, `status` vaut
        `fx_not_available` et seul le dollar est donné (`total` et `daily` sont `null`).
      required: [ status ]
      properties:
        status: { type: string, enum: [ ok, incomplete, fx_not_available ], description: "ok : tout est calculé ; incomplete : budget ou dates manquants ; fx_not_available : pas de taux de change valide." }
        days: { type: [ integer, 'null' ] }
        budget_usd_cents: { type: [ integer, 'null' ], description: "Coût total en centimes de dollar (budget par jour × jours, sans TVA)" }
        total: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ], description: Coût total en monnaie locale et en dollars }
        daily: { oneOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ], description: Budget par jour en monnaie locale et en dollars }
        fx: { oneOf: [ { $ref: '#/components/schemas/FxRate' }, { type: 'null' } ] }
    CampaignUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        objective: { type: string, enum: [ OUTCOME_ENGAGEMENT, OUTCOME_TRAFFIC, OUTCOME_AWARENESS, OUTCOME_SALES ] }
        destination: { type: string, enum: [ WHATSAPP, MESSENGER, INSTAGRAM_DIRECT, WEBSITE, APP, ON_POST, NONE ] }
        geo: { $ref: '#/components/schemas/CampaignGeo' }
        targeting: { $ref: '#/components/schemas/CampaignTargeting' }
        daily_budget_usd_cents: { type: integer, minimum: 1, maximum: 1000000, description: "Centimes de dollar. Sous 100 (1 $) : 422 budget_too_low ; au-dessus de 1 000 000 : 400." }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        copy: { $ref: '#/components/schemas/AdCopy' }
        tracking: { type: [ object, 'null' ], properties: { pixel_id: { type: string, pattern: '^[0-9]{5,25}$' } } }
        ab_test: { type: boolean }
        version: { type: integer, minimum: 1, description: Version lue ; périmée → 409 conflict avec meta.current_version }
      required: [ version ]
    AdCopy:
      type: object
      properties:
        primary_text: { type: string, maxLength: 125 }
        headline: { type: string, maxLength: 40 }
        description: { type: [ string, 'null' ], maxLength: 30 }
        cta: { type: string, enum: [ SEND_WHATSAPP_MESSAGE, SEND_MESSAGE, LEARN_MORE, SHOP_NOW, ORDER_NOW, CONTACT_US, BOOK_NOW, SIGN_UP, GET_OFFER ] }
        angle: { type: string, enum: [ price, quality, speed, scarcity, social_proof, novelty, convenience ] }
    CampaignList:
      type: object
      required: [ data ]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
        next_cursor: { type: [ string, 'null' ] }
    Proposal:
      type: object
      required: [ version, status, proposal, chosen, cost ]
      properties:
        version: { type: integer, minimum: 1, description: "Numéro d'ordre dans la campagne (onglet « Proposition 1, 2, 3 »)" }
        status: { type: string, enum: [ ready ], description: "Seules les propositions terminées sont listées ; un flux SSE interrompu n'en laisse aucune." }
        chosen: { type: boolean }
        proposal: { $ref: '#/components/schemas/CampaignProposal' }
        cost: { $ref: '#/components/schemas/CampaignCost' }
        created_at: { type: string, format: date-time }
    CampaignProposal:
      type: object
      description: Sortie validée du Stratège (docs/agents/02-stratege-campagne.md §6), après contrôle R3 par le code. Le coût en monnaie locale ne vient jamais de l'agent.
      required: [ objective, destination, optimization_goal, geo, advanced_targeting, budget, schedule, copy, warnings, visual_brief, flags ]
      properties:
        objective: { type: string, enum: [ OUTCOME_ENGAGEMENT, OUTCOME_TRAFFIC, OUTCOME_AWARENESS, OUTCOME_SALES ] }
        objective_reason: { type: string }
        destination: { type: string, enum: [ WHATSAPP, MESSENGER, INSTAGRAM_DIRECT, WEBSITE, APP, ON_POST, NONE ] }
        optimization_goal: { type: string, enum: [ CONVERSATIONS, LINK_CLICKS, LANDING_PAGE_VIEWS, POST_ENGAGEMENT, REACH, OFFSITE_CONVERSIONS ] }
        geo:
          type: object
          required: [ countries, cities ]
          properties:
            countries: { type: array, items: { type: string } }
            cities: { type: array, items: { type: object, required: [ name, radius_km ], properties: { name: { type: string }, radius_km: { type: integer } } } }
            reason: { type: string }
        advanced_targeting:
          type: object
          properties:
            age_min: { type: integer }
            age_max: { type: integer }
            genders: { type: string, enum: [ all, male, female ] }
            advantage_plus: { type: boolean }
        budget:
          type: object
          required: [ daily_usd_cents ]
          properties:
            daily_usd_cents: { type: integer, minimum: 100 }
            reason: { type: string }
        schedule:
          type: object
          required: [ start_date, end_date ]
          properties:
            start_date: { type: string, format: date }
            end_date: { type: string, format: date }
            reason: { type: string }
        copy: { $ref: '#/components/schemas/AdCopy' }
        tracking: { type: [ object, 'null' ], properties: { pixel_id: { type: string } } }
        warnings: { type: array, items: { type: string } }
        visual_brief: { type: string }
        flags: { type: array, items: { type: string } }
    CampaignStats:
      type: object
      required: [ summary, daily ]
      properties:
        summary:
          type: object
          properties:
            spend: { $ref: '#/components/schemas/Money' }
            results: { type: integer }
            result_type: { type: string }
            cost_per_result: { $ref: '#/components/schemas/Money' }
            reach: { type: integer }
            impressions: { type: integer }
            clicks: { type: integer }
            ctr: { type: number }
            plain_text: { type: string, description: "« 42 messages WhatsApp, soit 357 FCFA par client potentiel »" }
        daily: { type: array, items: { type: object, additionalProperties: true } }
        synced_at: { type: string, format: date-time }
    Rejection:
      type: object
      required: [ id, report ]
      properties:
        id: { type: string, format: uuid }
        meta_reason: { type: string }
        report: { type: object, description: Sortie du Modérateur (docs/agents/04) }
        can_fix: { type: boolean }
        appeal_recommended: { type: boolean }

    # ---------- Médias
    Capability:
      type: string
      enum: [ c1_text_to_image, c2_reference_to_image, c3_edit, c4_extend, cutout, c5_image_to_video, c6_text_to_video, c7_reference_to_video ]
    Format:
      type: string
      enum: [ '4:5', '9:16', '1:1', '1.91:1' ]
    MediaModel:
      type: object
      required: [ id, display_name, provider, capabilities, levels ]
      properties:
        id: { type: string }
        display_name: { type: string }
        provider: { type: string, enum: [ fal, higgsfield, byteplus ] }
        capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }
        recommended: { type: boolean }
        card: { type: object, properties: { for: { type: string }, pros: { type: array, items: { type: string } }, cons: { type: array, items: { type: string } } } }
        max_references: { type: integer }
        status: { type: string, enum: [ active, unavailable ] }
        levels:
          type: array
          items:
            type: object
            required: [ level, credits ]
            properties:
              level: { type: string, enum: [ standard, high ] }
              credits: { type: integer, description: Par image (ou durée minimale en vidéo) }
              credits_by_duration: { type: object, additionalProperties: { type: integer } }
              est_seconds: { type: integer }
    GenerationRequest:
      type: object
      required: [ capability, model_id, level ]
      additionalProperties: false
      properties:
        capability: { $ref: '#/components/schemas/Capability' }
        model_id: { type: string }
        level: { type: string, enum: [ standard, high ] }
        count: { type: integer, minimum: 1, maximum: 6, default: 3 }
        format: { $ref: '#/components/schemas/Format' }
        duration_s: { type: integer, enum: [ 5, 10, 15, 30 ] }
        page_id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        product_image_path: { type: string, maxLength: 300 }
        reference_paths: { type: array, maxItems: 10, items: { type: string, maxLength: 300 } }
        similar_to_visual_id: { type: string, format: uuid }
        answers: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/Answer' } }
    Generation:
      type: object
      required: [ id, status, model_id, credits_reserved ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ queued, running, completed, partial, failed, nsfw, canceled ] }
        model_id: { type: string }
        credits_reserved: { type: integer }
        credits_refunded: { type: integer }
        queue_position: { type: [ integer, 'null' ] }
        eta_seconds: { type: [ integer, 'null' ] }
        fallback_offer: { type: [ object, 'null' ], properties: { model_id: { type: string }, display_name: { type: string }, credits: { type: integer } } }
        visuals: { type: array, items: { $ref: '#/components/schemas/Visual' } }
    Visual:
      type: object
      required: [ id, kind, status ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [ image, video ] }
        status: { type: string, enum: [ pending, ready, failed, expired ] }
        formats: { type: object, additionalProperties: { type: string, format: uri }, description: "URL signées valables 15 minutes, par format" }
        chosen: { type: boolean }
        used_in_campaign: { type: boolean }
        files_expire_at: { type: [ string, 'null' ], format: date-time }
        concept: { type: string }
    VisualList:
      type: object
      required: [ data ]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Visual' } }
        next_cursor: { type: [ string, 'null' ] }
    VisualEditRequest:
      type: object
      required: [ instruction ]
      additionalProperties: false
      properties:
        instruction: { type: string, minLength: 3, maxLength: 500 }
        model_id: { type: string, description: Obligatoire si la modification touche la scène }
        level: { type: string, enum: [ standard, high ] }

    # ---------- Facturation
    Billing:
      type: object
      required: [ plan, status, credits ]
      properties:
        plan: { type: string, enum: [ trial, starter, pro, business ] }
        status: { type: string, enum: [ trialing, active, grace, read_only, canceled ] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        grace_until: { type: [ string, 'null' ], format: date-time }
        credits: { type: object, properties: { monthly: { type: integer }, bonus: { type: integer }, purchased: { type: integer }, total: { type: integer } } }
        quotas: { $ref: '#/components/schemas/Quotas' }
    LedgerEntry:
      type: object
      required: [ id, bucket, kind, amount, created_at ]
      properties:
        id: { type: integer }
        bucket: { type: string, enum: [ monthly, bonus, purchased ] }
        kind: { type: string, enum: [ grant_monthly, purchase, reserve, consume, release, expire, admin_grant, admin_revoke, referral, trial ] }
        amount: { type: integer }
        reason: { type: [ string, 'null' ] }
        created_at: { type: string, format: date-time }
    LedgerList:
      type: object
      required: [ data ]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
        next_cursor: { type: [ string, 'null' ] }
    CheckoutRequest:
      type: object
      required: [ purpose ]
      additionalProperties: false
      properties:
        purpose: { type: string, enum: [ subscription, upgrade, credits ] }
        plan_code: { type: string, enum: [ starter, pro, business ] }
        credits_qty: { type: integer, minimum: 1, maximum: 1000 }
    Checkout:
      type: object
      required: [ payment_id, checkout_url, amount, fees_xaf, total_xaf ]
      properties:
        payment_id: { type: string, format: uuid }
        checkout_url: { type: string, format: uri }
        amount: { $ref: '#/components/schemas/Money' }
        fees_xaf: { type: integer }
        total_xaf: { type: integer }
        expires_at: { type: string, format: date-time }
    Payment:
      type: object
      required: [ id, purpose, amount_xaf, status ]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [ subscription, upgrade, credits ] }
        amount_xaf: { type: integer }
        fees_xaf: { type: integer }
        status: { type: string, enum: [ pending, succeeded, failed, expired, manual ] }
        paid_at: { type: [ string, 'null' ], format: date-time }
        receipt_url: { type: [ string, 'null' ], format: uri }
    PaymentList:
      type: object
      required: [ data ]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        next_cursor: { type: [ string, 'null' ] }
    PaymentProofRequest:
      type: object
      required: [ transaction_ref, file_path ]
      additionalProperties: false
      properties:
        payment_id: { type: string, format: uuid }
        transaction_ref: { type: string, minLength: 3, maxLength: 80 }
        file_path: { type: string, maxLength: 300 }
    PaymentProof:
      type: object
      required: [ id, status ]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ submitted, accepted, rejected ] }
        note: { type: [ string, 'null' ] }

    # ---------- Optimiseur, notifications, support, parrainage
    Recommendation:
      type: object
      required: [ id, action, message, status ]
      properties:
        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        action: { type: string, enum: [ pause, resume, budget_up, budget_down, new_visual, extend, wait ] }
        message: { type: string }
        evidence: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [ proposed, applied, dismissed ] }
    Notification:
      type: object
      required: [ id, type, title, created_at ]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: [ string, 'null' ] }
        link: { type: [ string, 'null' ], pattern: '^/' }
        read_at: { type: [ string, 'null' ], format: date-time }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [ data, unread ]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        unread: { type: integer }
        next_cursor: { type: [ string, 'null' ] }
    NotificationPreference:
      type: object
      required: [ type, in_app, email ]
      properties:
        type: { type: string, enum: [ generation_ready, campaign_approved, campaign_rejected, meta_payment_failed, budget_exhausted, campaign_ended, quota_almost_reached, subscription_ending, meta_token_renewal, support_reply, weekly_summary, optimizer_suggestion ] }
        in_app: { type: boolean }
        email: { type: boolean }
    Ticket:
      type: object
      required: [ id, subject, category, status ]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        category: { type: string, enum: [ payment, campaign, account, other ] }
        status: { type: string, enum: [ open, waiting_user, closed ] }
        created_at: { type: string, format: date-time }
    TicketCreate:
      type: object
      required: [ subject, category, body ]
      additionalProperties: false
      properties:
        subject: { type: string, minLength: 3, maxLength: 200 }
        category: { type: string, enum: [ payment, campaign, account, other ] }
        body: { type: string, minLength: 1, maxLength: 10000 }
        attachment_paths: { type: array, maxItems: 5, items: { type: string, maxLength: 300 } }
    TicketMessage:
      type: object
      required: [ id, author_type, body, created_at ]
      properties:
        id: { type: string, format: uuid }
        author_type: { type: string, enum: [ user, admin ] }
        body: { type: string }
        attachments: { type: array, items: { type: string, format: uri } }
        created_at: { type: string, format: date-time }
    TicketMessageCreate:
      type: object
      required: [ body ]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        attachment_paths: { type: array, maxItems: 5, items: { type: string, maxLength: 300 } }
    AssistantAnswer:
      type: object
      required: [ answer ]
      properties:
        conversation_id: { type: string, format: uuid }
        answer: { type: string }
        steps: { type: [ array, 'null' ], items: { type: string } }
        links: { type: array, items: { type: object, properties: { label: { type: string }, route: { type: string, pattern: '^/' } } } }
        detected_issue: { type: [ string, 'null' ] }
        escalate_to_support: { type: boolean }
    Referral:
      type: object
      required: [ code, link, bonus_credits ]
      properties:
        code: { type: string }
        link: { type: string, format: uri }
        bonus_credits: { type: integer, const: 2 }
        referrals: { type: array, items: { type: object, properties: { status: { type: string, enum: [ signed_up, paid, rewarded ] }, created_at: { type: string, format: date-time } } } }

    # ---------- Administration
    AdminWorkspaceUpdate:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [ active, read_only, suspended ] }
        plan_code: { type: string, enum: [ starter, pro, business ] }
        extend_days: { type: integer, minimum: 1, maximum: 90 }
        reason: { type: string, minLength: 3, maxLength: 300 }
      required: [ reason ]
    AdminMediaModel:
      type: object
      required: [ provider_code, endpoint, capabilities, display_name, status, levels ]
      properties:
        provider_code: { type: string, enum: [ fal, higgsfield, byteplus ] }
        endpoint: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }
        display_name: { type: string }
        card: { type: object }
        max_references: { type: integer, minimum: 0, maximum: 50 }
        status: { type: string, enum: [ testing, active, disabled ] }
        recommended_for: { type: array, items: { type: string } }
        levels:
          type: array
          maxItems: 2
          items:
            type: object
            required: [ level, provider_params, unit, cost_usd, min_margin, min_credits ]
            properties:
              level: { type: string, enum: [ standard, high ] }
              provider_params: { type: object }
              unit: { type: string, enum: [ image, second ] }
              cost_usd: { type: number, minimum: 0 }
              min_margin: { type: number, minimum: 0, maximum: 0.95 }
              min_credits: { type: integer, minimum: 1 }
              durations_allowed: { type: array, items: { type: integer } }
    RoutingRule:
      type: object
      required: [ primary_model_id, max_wait_seconds ]
      properties:
        primary_model_id: { type: string }
        fallback_model_id: { type: [ string, 'null' ] }
        max_wait_seconds: { type: integer, minimum: 10, maximum: 600 }
        active: { type: boolean }
    AuditEntry:
      type: object
      required: [ id, admin_id, action, created_at ]
      properties:
        id: { type: integer }
        admin_id: { type: string, format: uuid }
        action: { type: string }
        target_type: { type: [ string, 'null' ] }
        target_id: { type: [ string, 'null' ] }
        before: { type: [ object, 'null' ] }
        after: { type: [ object, 'null' ] }
        created_at: { type: string, format: date-time }
