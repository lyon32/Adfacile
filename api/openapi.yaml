      - { name: decision, in: path, required: true, schema: { type: string, enum: [ accept, reject ] } }
    post:
      tags: [ Administration ]
      operationId: adminReviewProof
      summary: Valider (active l'abonnement ou les crédits) ou refuser une preuve de paiement
      security: [ { sessionCookie: [] } ]
      requestBody:
        required: false
