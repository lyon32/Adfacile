      - { $ref: '#/components/parameters/GenerationId' }
    post:
      tags: [ Médias ]
      operationId: cancelGeneration
      summary: Annuler (possible tant que le traitement n'a pas commencé ; crédits rendus)
      responses:
        '200': { description: Annulée, content: { application/json: { schema: { $ref: '#/components/schemas/Generation' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/generations/{generationId}/fallback:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/GenerationId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [ Médias ]
      operationId: acceptFallback
      summary: Accepter le modèle équivalent proposé (après 60 s d'attente)
      responses:
        '202': { description: Relancée sur le modèle de secours, content: { application/json: { schema: { $ref: '#/components/schemas/Generation' } } } }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/visuals:
