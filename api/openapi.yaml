      operationId: getBilling
      summary: Abonnement, période, soldes de crédits, quotas (propriétaire)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Billing' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/credits/ledger:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    get:
      tags: [ Facturation et crédits ]
      operationId: getLedger
      summary: Mouvements de crédits
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/checkout:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [ Facturation et crédits ]
      operationId: createCheckout
