openapi: 3.1.0
info:
  title: Pubeka API
  version: 1.0.0
  summary: API interne de Pubeka (application web, puis application mobile V3).
  description: |
    Source de vérité du contrat d'API. Règles communes : docs/architecture/API_SPEC.md.
    - Toutes les erreurs suivent le format **Problem Details** (RFC 9457), type `application/problem+json`, avec un `code` stable.
    - Toute ressource métier est rangée sous `/workspaces/{workspaceId}` : l'espace est explicite dans chaque appel.
    - Les actions qui coûtent de l'argent ou des crédits exigent l'en-tête `Idempotency-Key`.
  license:
    name: Propriétaire — tous droits réservés
  contact:
    name: Pubeka
    url: https://pubeka.com
servers:
  - url: https://app.pubeka.com/api/v1
    description: Production
  - url: http://localhost:5173/api/v1
    description: Développement local

security:
  - sessionCookie: []
  - bearerAuth: []

tags:
  - name: Public
    description: 'Sans connexion : maintenance, formules, taux de change.'
  - name: Compte
    description: Profil de l'utilisateur connecté, export et suppression du compte.
  - name: Espaces et équipe
    description: Espaces de travail, membres, rôles et invitations.
  - name: Meta
    description: Connexion Meta, Pages, comptes publicitaires, kit de marque, bilan de santé.
  - name: Sources et analyse
    description: Envoi de fichiers et analyse des sources par l'Analyste.
  - name: Campagnes
    description: Brouillons, propositions du Stratège, publication, pause, statistiques, refus.
  - name: Médias
    description: Catalogue de modèles, générations, visuels, modifications et formats.
  - name: Facturation et crédits
    description: Abonnement, crédits, paiements SasPay et preuves de paiement.
  - name: Optimiseur
    description: Suggestions de l'Optimiseur (Pro, Business).
  - name: Notifications
    description: Notifications dans l’application et préférences.
  - name: Support et aide
    description: Tickets de support et bulle d'aide.
  - name: Parrainage
    description: Code de parrainage et filleuls.
  - name: Webhooks
    description: Événements entrants signés des fournisseurs.
  - name: Administration
    description: Réservé aux administrateurs en double vérification (aal2) ; 404 pour tous les autres.

paths:
  # ------------------------------------------------------------------ Public
  /public/maintenance:
    get:
      tags: [ Public ]
      operationId: getMaintenance
      summary: État du mode maintenance
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Maintenance' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /public/plans:
    get:
      tags: [ Public ]
      operationId: listPlans
      summary: Formules et prix
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ Compte
  /me:
    get:
      tags: [ Compte ]
      operationId: getMe
      summary: Profil de l'utilisateur connecté
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [ Compte ]
      operationId: updateMe
      summary: Modifier son profil
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [ Compte ]
      operationId: deleteMe
      summary: Supprimer son compte (définitif)
      description: Exige une réauthentification récente (moins de 5 minutes) et la confirmation `SUPPRIMER`.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ confirmation ], properties: { confirmation: { type: string, const: SUPPRIMER } } } } }
      responses:
        '202': { description: "Suppression programmée, e-mail de confirmation envoyé" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/export:
    post:
      tags: [ Compte ]
      operationId: exportMyData
      summary: Demander l'export de ses données (lien envoyé par e-mail)
      responses:
        '202': { description: Export en préparation }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Espaces et équipe
  /workspaces:
    get:
      tags: [ Espaces et équipe ]
      operationId: listWorkspaces
      summary: Espaces dont l'utilisateur est membre
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/Workspace' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    get:
      tags: [ Espaces et équipe ]
      operationId: getWorkspace
      summary: Détail d'un espace (formule, statut, quotas)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [ Espaces et équipe ]
      operationId: renameWorkspace
      summary: Renommer l'espace (propriétaire)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ name ], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 120 } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/members:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    get:
      tags: [ Espaces et équipe ]
      operationId: listMembers
      summary: Membres de l'espace (le propriétaire d'abord, puis par date d'arrivée)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/Member' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/members/{profileId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [ Espaces et équipe ]
      operationId: changeMemberRole
      summary: Changer le rôle d'un membre (propriétaire)
      description: Le propriétaire ne peut pas changer son propre rôle (409, SECURITY_NOTES EC-TEAM-05) ; la propriété se transfère par `transfer-ownership`.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ role ], additionalProperties: false, properties: { role: { type: string, enum: [ editor, viewer ] } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [ Espaces et équipe ]
      operationId: removeMember
      summary: Retirer un membre (propriétaire)
      description: Le propriétaire ne peut pas se retirer lui-même (409, EC-TEAM-05). Le membre retiré reçoit 404 à sa requête suivante sur l'espace (EC-TEAM-04).
      responses:
        '204': { description: Retiré }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/invitations:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    post:
      tags: [ Espaces et équipe ]
      operationId: inviteMember
      summary: Inviter un membre par e-mail (selon la limite de la formule)
      description: |
        Envoie un e-mail avec un lien d'acceptation valable 7 jours ; seul le hachage du jeton est stocké. Une nouvelle invitation à la même adresse remplace la précédente.
        La limite de membres de la formule compte le propriétaire, les membres et les invitations en attente (402 `member_limit_reached`). Personne déjà membre : 409 (EC-TEAM-01).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ email, role ], additionalProperties: false, properties: { email: { type: string, format: email, maxLength: 254 }, role: { type: string, enum: [ editor, viewer ] } } } } }
      responses:
        '201': { description: Invitation envoyée, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/transfer-ownership:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
    post:
      tags: [ Espaces et équipe ]
      operationId: transferOwnership
      summary: Transférer la propriété de l'espace à un membre (propriétaire, réauthentification récente)
      description: L'ancien propriétaire devient éditeur ; une seule transaction, journalisée. Proposé avant la suppression du compte du propriétaire (SECURITY_NOTES EC-TEAM-06). Dernière connexion de plus de 5 minutes → 403 `mfa_required` avec `meta.reason = "recent_login_required"` (API_SPEC §2.2 règle 6).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ profile_id ], additionalProperties: false, properties: { profile_id: { type: string, format: uuid } } } } } }
      responses:
        '200': { description: Propriété transférée, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /invitations/accept:
    post:
      tags: [ Espaces et équipe ]
      operationId: acceptInvitation
      summary: Accepter une invitation (jeton reçu par e-mail)
      description: |
        Jeton inconnu → 404. Compte dont l'e-mail diffère de l'e-mail invité → 403 `forbidden` (EC-TEAM-02). Invitation expirée ou déjà utilisée → 410 (EC-TEAM-03).
        Limite de membres de la formule atteinte → 402 `member_limit_reached` ; espace en lecture seule ou suspendu → 403.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ token ], additionalProperties: false, properties: { token: { type: string, minLength: 32, maxLength: 128 } } } } }
      responses:
        '200': { description: Membre ajouté, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ Meta
  /workspaces/{workspaceId}/meta/connect:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    post:
      tags: [ Meta ]
      operationId: startMetaConnect
      summary: Démarrer la connexion Meta (renvoie l'URL de la fenêtre Facebook)
      description: Propriétaire, espace modifiable. L'URL contient un paramètre `state` signé (anti-CSRF) lié à l'utilisateur, à l'espace et à une durée de 10 minutes ; il ne sert qu'une fois.
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/MetaConnectRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ authorize_url ], properties: { authorize_url: { type: string, format: uri } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /meta/callback:
    get:
      tags: [ Meta ]
      operationId: metaCallback
      summary: Retour de la fenêtre Facebook (redirection vers l'application)
      description: |
        Vérifie le paramètre `state` (signature, durée, utilisateur de la session, usage unique), échange le code, chiffre et stocke le jeton, puis enregistre les comptes publicitaires et les Pages.
        Toujours une redirection 302 vers `/bienvenue/meta` ou `/reglages/comptes-meta` (selon `return_to` de la demande) avec `?meta=connected`, ou `?meta=error&reason=denied|state|meta` (APPFLOW §6.1 : « La connexion n'a pas abouti »). Sans session : 401.
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, required: true, schema: { type: string, maxLength: 2048 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: error_reason, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: error_description, in: query, required: false, schema: { type: string, maxLength: 1000 } }
      responses:
        '302': { description: Redirection vers /bienvenue/meta ou /reglages/comptes-meta }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/meta/connections:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    get:
      tags: [ Meta ]
      operationId: listMetaConnections
      summary: Connexions Meta (sans jeton)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/MetaConnection' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /workspaces/{workspaceId}/meta/connections/{connectionId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [ Meta ]
      operationId: disconnectMeta
      summary: Déconnecter Meta (le jeton est effacé, les Pages sont désactivées)
      description: Propriétaire, espace modifiable. Les campagnes déjà publiées restent actives chez Meta. L'autorisation donnée à Pubeka se retire aussi dans les réglages de Facebook.
      responses:
        '204': { description: Déconnecté }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /workspaces/{workspaceId}/meta/connections/{connectionId}/health-check:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [ Meta ]
      operationId: runHealthCheck
      summary: Lancer le bilan de santé (F1)
      description: Propriétaire, espace modifiable. Relit chez Meta les comptes publicitaires et les Pages (mise à jour de la liste), puis contrôle le compte publicitaire et la Page actifs.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HealthCheck' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '424': { $ref: '#/components/responses/FailedDependency' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /workspaces/{workspaceId}/pages:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    get:
      tags: [ Meta ]
      operationId: listPages
      summary: Pages Facebook connectées
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data, quotas ], properties: { data: { type: array, items: { $ref: '#/components/schemas/Page' } }, quotas: { type: object, required: [ pages_active, pages_limit ], properties: { pages_active: { type: integer }, pages_limit: { type: integer } } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /workspaces/{workspaceId}/pages/{pageId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/PageId' }
    patch:
      tags: [ Meta ]
      operationId: updatePage
      summary: Activer une Page (selon la formule) ou régler la langue et le ton des pubs
      description: 'Activer ou désactiver : propriétaire. Langue et ton des pubs : propriétaire ou éditeur. Au-delà de la limite de la formule → 402 `page_limit_reached`. Désactiver une Page verrouillée pour la période (une campagne a été lancée avec elle) → 409 `conflict` avec `meta.reason = "page_locked"`.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PageUpdate' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /workspaces/{workspaceId}/pages/{pageId}/brand-kit:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/PageId' }
    get:
      tags: [ Meta ]
      operationId: getBrandKit
      summary: Kit de marque de la Page (valeurs par défaut si jamais enregistré)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      tags: [ Meta ]
      operationId: putBrandKit
      summary: Enregistrer le kit de marque
      description: Propriétaire ou éditeur, espace modifiable. `logo_path` doit désigner un fichier de l'espace dans le compartiment `brand` (`<workspace_id>/…`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /workspaces/{workspaceId}/ad-accounts:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    get:
      tags: [ Meta ]
      operationId: listAdAccounts
      summary: Comptes publicitaires
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/AdAccount' } } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
