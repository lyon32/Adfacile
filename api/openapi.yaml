      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VisualList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/visuals/{visualId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
