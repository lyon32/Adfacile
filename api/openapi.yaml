  # ------------------------------------------------------------------ Campagnes
  /workspaces/{workspaceId}/campaigns:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    get:
      tags: [ Campagnes ]
      operationId: listCampaigns
      summary: Liste des campagnes
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/CampaignStatus' } }
        - { name: page_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [ Campagnes ]
      operationId: createCampaign
      summary: Créer un brouillon de campagne à partir d'une analyse
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ analysis_id, platform ], properties: { analysis_id: { type: string, format: uuid }, page_id: { type: string, format: uuid, description: "Absente tant que Meta n'est pas connecté : on peut préparer la campagne sans publier (APPFLOW §8.0)." }, platform: { type: string, enum: [ meta ] } } } } }
      description: |
        L'analyse doit être au statut `ready` (questions répondues) et appartenir à l'espace ; la Page doit appartenir à l'espace.
        Le brouillon reprend le compte publicitaire actif. Aucun appel IA, aucune dépense.
      responses:
        '201': { description: Brouillon créé, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/campaigns/{campaignId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
    get:
      tags: [ Campagnes ]
      operationId: getCampaign
      summary: Détail d'une campagne
      description: "Le coût (`cost`) est recalculé à chaque lecture avec le taux de change en vigueur (sans TVA : retirée pour le moment, décision du 17/10/2026)."
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [ Campagnes ]
      operationId: updateCampaign
      summary: Modifier un brouillon, ou une campagne publiée (renvoyée à Meta, peut relancer une vérification)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CampaignUpdate' } } }
      description: |
        `version` est obligatoire (EC-TEAM-08). Version périmée : `409 conflict` avec `meta.current_version`, rien n'est modifié.
        S15 ne modifie que les brouillons (`draft`) ; la modification d'une campagne publiée arrive avec S16. Chaque champ
        est revalidé par le serveur (budget 100 à 1 000 000 centimes, dates, textes) ; le coût est recalculé. `copy` et `targeting` sont fusionnés champ par champ ; `geo` et `targeting.interests` sont remplacés en entier.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/proposals:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
    get:
      tags: [ Campagnes ]
      operationId: listProposals
      summary: Propositions IA de la campagne (toutes versions)
      description: "Les propositions terminées (status ready), de la plus ancienne à la plus récente (onglets « Proposition 1, 2, 3 »)."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/Proposal' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [ Campagnes ]
      operationId: generateProposal
      summary: Générer une proposition (Stratège), avec affichage progressif
      description: |
        Action qui dépense un appel IA : `Idempotency-Key` obligatoire (UUID v4). Une clé désigne une seule génération par
        campagne : le renvoi de la même clé ne refait aucun appel IA (la proposition déjà produite est rejouée, en-tête
        `Idempotent-Replayed: true`) ; si la première est encore en cours : `409 conflict` avec `retry_after_s` ; si elle
        a échoué : la même erreur (un appel au résultat incertain n'est jamais relancé automatiquement : nouvelle clé).

        Avec `Accept: text/event-stream`, la réponse est un flux SSE (API_SPEC §10), toujours en `200` :
        - `field` : `{ "path": "copy.headline", "value": "…" }`, un événement par champ terminé, dans l'ordre d'écriture.
          C'est un **aperçu non contractuel** : seul `done` fait foi ;
        - `done` : la `Proposal` complète, validée et enregistrée ;
        - `retry` : le Stratège réécrit (sa première réponse était invalide) ; l'aperçu déjà reçu est remplacé par le `done` final ;
        - `error` : un Problem Details (même forme que les erreurs HTTP), puis le flux se ferme.
        Sans ce type, réponse JSON complète en `201`. Une erreur avant le début du flux est une réponse HTTP normale.
        Si le client coupe la connexion, la génération SE TERMINE et s'enregistre (rien n'est payé deux fois) : en rouvrant la
        requête avec la même `Idempotency-Key`, le client reçoit `done` sans nouvel appel (reprise), ou `409` tant qu'elle est en cours.
        Délai maximal d'une génération en flux : 100 secondes.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: "Flux SSE (field, done, error)", content: { text/event-stream: { schema: { type: string } } } }
        '201': { description: Proposition créée, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/proposals/{version}/choose:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
      - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      tags: [ Campagnes ]
      operationId: chooseProposal
      summary: Retenir une proposition (copiée dans la campagne)
      description: |
        Copie les champs de la proposition dans le brouillon et note la version retenue. Le serveur revalide tout (budget,
        dates, textes) : une proposition devenue invalide (date passée…) est refusée en `400 validation_failed` avec le champ en cause. Seul un brouillon peut en recevoir une.
        Le corps porte la `version` du brouillon lue par le client : si le brouillon a changé depuis, `409 conflict` avec
        `meta.current_version` et rien n'est écrasé.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [ version ], properties: { version: { type: integer, minimum: 1, description: 'Version du brouillon lue par le client' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/publish:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [ Campagnes ]
      operationId: publishCampaign
      summary: Publier sur la plateforme (décompte le quota de campagnes)
      description: |
        Action qui engage de l'argent chez Meta et un quota : `Idempotency-Key` obligatoire (UUID v4). La même clé rejoue la
        même réponse (`Idempotent-Replayed: true`) sans nouvelle publication ni nouveau quota (EC-CAMP-01).

        Le serveur relit TOUT depuis la base (budget, dates, textes, Page, compte publicitaire) : rien n'est repris du navigateur.
        Ordre : rôle, espace modifiable, validation du corps, état de la campagne, clause de responsabilité (première publication
        de l'espace), Page active dans la formule, Meta connecté, budget, dates, visuel, taux de change, quota ; puis
        `draft → publishing` (ou `rejected`/`error → publishing`) en une seule instruction ; puis la tâche `campaign.publish` est
        lancée et la réponse est `202`. Le statut passe ensuite à `in_review` quand Meta a reçu la campagne, ou à `error`
        (quota rendu) en cas d'échec ; un résultat incertain n'est JAMAIS relancé automatiquement : la tâche cherche d'abord chez
        Meta la campagne portant la référence de publication (SECURITY_NOTES EC-META-05).

        Erreurs : `400 validation_failed` (liste fermée d'API_SPEC §4 : aucun code 422 générique ; SECURITY_NOTES écrit 422) pour EC-CAMP-08
        (clause non acceptée, champ `accept_liability`, `meta.reason: liability_required`) et EC-CAMP-04 (la fin devient antérieure au début,
        `meta.suggested_start_date` et `meta.suggested_end_date`), `422 budget_too_low`, `402 campaign_quota_reached` (EC-CAMP-02), `402 page_limit_reached` (EC-CAMP-03,
        `meta.available_from` ; EC-CAMP-09), `410 gone` (EC-CAMP-06 : visuel expiré), `409 conflict` (`meta.reason` : `fx_changed` avec
        `meta.new_total` — EC-CAMP-05 ; `publication_in_progress` ; `invalid_transition`), `409 already_published`,
        `424 meta_not_connected`, `424 meta_token_expired`, `424 meta_payment_method_missing`. Une campagne refusée par Meta qui est republiée
        ne décompte aucun quota (EC-CAMP-07).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PublishRequest' } } }
      responses:
        '202': { description: Publication en cours (statut publishing puis in_review), content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '424': { $ref: '#/components/responses/FailedDependency' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/pause:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
    post:
      tags: [ Campagnes ]
      operationId: pauseCampaign
      summary: Mettre en pause (envoyé directement à Meta ; autorisé même en lecture seule)
      description: |
        Propriétaire ou éditeur. Autorisé en lecture seule et même si la Page n'est plus dans la formule (EC-CAMP-09), pour que le client
        puisse toujours arrêter de dépenser. Meta est appelé D'ABORD : le statut ne passe à `paused` que si Meta a répondu (EC-META-07 :
        pas de faux succès, `502 meta_error`). Une campagne déjà en pause renvoie `200` sans appel (idempotent). Autres états : `409 conflict`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/FailedDependency' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/resume:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
    post:
      tags: [ Campagnes ]
      operationId: resumeCampaign
      summary: Reprendre une campagne en pause
      description: |
        Propriétaire ou éditeur, espace modifiable, Page dans la formule (`402 page_limit_reached` sinon, EC-CAMP-09). Meta est appelé d'abord ;
        le statut ne change que si Meta a répondu. Déjà en diffusion : `200` sans appel. Autres états : `409 conflict`.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/FailedDependency' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/relaunch:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
    post:
      tags: [ Campagnes ]
      operationId: relaunchCampaign
      summary: Relancer une campagne
      description: |
        Deux usages, choisis par `mode` (décision du 16/10/2026 pour `recover`, PRD F9 pour `copy`) :
        - `recover` : une campagne ARRÊTÉE (`stopped`, paiement Meta refusé) reprend la diffusion (`stopped → active`, événement `recover`).
          C'est une ACTION DU CLIENT, faite après qu'il a réglé sa facture ou alimenté ses fonds publicitaires chez Meta : Pubeka ne la
          détecte pas tout seul. Meta est appelé d'abord ; s'il refuse, le message de Meta (traduit) est renvoyé dans `meta.title` et
          `meta.message` et le statut reste `stopped` (jamais un échec muet). Réponse `200`.
        - `copy` : crée un nouveau brouillon à partir de la campagne (même visuel, ou à renouveler). Compte comme une nouvelle campagne
          à sa publication. Réponse `201`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RelaunchRequest' } } }
      responses:
        '200': { description: Campagne arrêtée relancée (mode recover), content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '201': { description: Nouveau brouillon (mode copy), content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '424': { $ref: '#/components/responses/FailedDependency' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/stats:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
    get:
      tags: [ Campagnes ]
      operationId: getCampaignStats
      summary: Statistiques (copiées toutes les heures)
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignStats' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/stats/refresh:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
    post:
      tags: [ Campagnes ]
      operationId: refreshCampaignStats
      summary: Actualiser maintenant (limité à 1 fois toutes les 5 minutes)
      responses:
        '202': { description: Synchronisation lancée ; l'écran se met à jour en temps réel }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/rejections/{rejectionId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
      - { name: rejectionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [ Campagnes ]
      operationId: getRejection
      summary: Rapport du Modérateur sur un refus
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Rejection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/campaigns/{campaignId}/rejections/{rejectionId}/apply-fix:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/CampaignId' }
      - { name: rejectionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [ Campagnes ]
      operationId: applyRejectionFix
      summary: Appliquer la correction et republier (sans quota)
      responses:
        '202': { description: Republiée, content: { application/json: { schema: { $ref: '#/components/schemas/Campaign' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Médias
  /media-models:
    get:
      tags: [ Médias ]
      operationId: listMediaModels
      summary: Modèles visibles (actifs et testés), avec niveaux et crédits
      parameters:
        - { name: capability, in: query, required: false, schema: { $ref: '#/components/schemas/Capability' } }
        - { name: use_case, in: query, required: false, schema: { type: string, enum: [ product, text, edit, video ] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [ data ], properties: { data: { type: array, items: { $ref: '#/components/schemas/MediaModel' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workspaces/{workspaceId}/generations:
    parameters: [ { $ref: '#/components/parameters/WorkspaceId' } ]
    post:
      tags: [ Médias ]
      operationId: createGeneration
