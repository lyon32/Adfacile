# Préparation commune à tous les travaux : pnpm (version de package.json), Node (version de .nvmrc),
# dépendances installées depuis le fichier de verrouillage, sans le modifier. Voir docs/architecture/CI_CD.md.
name: Préparer le dépôt EasAds
description: Installe pnpm, Node.js et les dépendances (pnpm install --frozen-lockfile).
runs:
  using: composite
  steps:
    - name: Installer pnpm (version lue dans package.json)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false

    - name: Installer Node.js (version lue dans .nvmrc)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Installer les dépendances
      shell: bash
      run: pnpm install --frozen-lockfile
