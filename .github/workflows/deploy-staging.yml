# Déploiement automatique en préproduction après une CI réussie sur main — docs/architecture/CI_CD.md §4.
# Ordre fixe : migrations (projet Supabase de développement) → tâches Trigger.dev (staging) → Vercel → tests de fumée.
# Actif seulement si la variable de dépôt EASADS_PIPELINE_ENABLED vaut true.
name: Déploiement préproduction

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Préproduction
    if: >-
      vars.EASADS_PIPELINE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: easads-staging
      url: https://${{ vars.STAGING_APP_HOST }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      STAGING_APP_HOST: ${{ vars.STAGING_APP_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: 1. Migrations — aperçu
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run
      - name: 1. Migrations — application
        run: supabase db push

      - name: 2. Tâches Trigger.dev (environnement staging)
        run: pnpm --filter @easads/jobs exec trigger.dev deploy --env staging --external-id "$SHA"

      - name: 3. Vercel — construction (variables de l'environnement Preview)
        run: |
          pnpm exec vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          pnpm exec vercel build --token="$VERCEL_TOKEN"
      - name: 3. Vercel — mise en ligne et adresse fixe de préproduction
        run: |
          url="$(pnpm exec vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "Déploiement : $url"
          pnpm exec vercel alias set "$url" "$STAGING_APP_HOST" --token="$VERCEL_TOKEN"

      - name: 4. Tests de fumée sur la préproduction
        env:
          BASE_URL: https://${{ vars.STAGING_APP_HOST }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          pnpm --filter @easads/web exec playwright install --with-deps chromium
          pnpm e2e:smoke
