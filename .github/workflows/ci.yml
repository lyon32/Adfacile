# Intégration continue Pubeka — docs/architecture/CI_CD.md §3.
# Bloque la fusion dans main au premier échec (vérification obligatoire : « CI terminée »).
# Tant que le monodépôt n'existe pas (pas de pnpm-workspace.yaml), tous les travaux sont ignorés.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Valeurs publiques et sans danger : la CI n'utilise aucun vrai service (TESTING §1).
  NEXT_PUBLIC_APP_ENV: development
  NEXT_PUBLIC_SITE_URL: http://localhost:5173
  NEXT_PUBLIC_APP_URL: http://app.localhost:5173
  SITE_HOSTS: localhost:5173
  PUBEKA_FAKE_PROVIDERS: all
  PUBEKA_JOB_DISPATCH: inline
  SUPABASE_CLI_VERSION: 2.118.0
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    name: Monodépôt présent ?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: Chercher pnpm-workspace.yaml
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Monodépôt Pubeka absent : CI ignorée (docs/architecture/CI_CD.md §9)."
          fi

  quality:
    name: Format, lint, typage, contrat
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm openapi:lint
      - run: pnpm i18n:check
      - name: Failles critiques dans les dépendances de production
        run: pnpm audit --prod --audit-level critical

  secrets:
    name: Recherche de secrets
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # gitleaks lit la liste des commits de la PR (GET /pulls/{n}/commits)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de commentaire sur la PR (demanderait un droit d'écriture) : le résultat est dans la tâche.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  migrations-guard:
    name: Migrations jamais modifiées
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuser toute migration existante modifiée, renommée ou supprimée
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-status --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- supabase/migrations)"
          if [ -n "$changed" ]; then
            echo "::error::Une migration déjà existante a été modifiée. Créer une NOUVELLE migration (CONVENTIONS §5.1)."
            echo "$changed"
            exit 1
          fi

  unit:
    name: Tests unitaires, contrat et base
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unitaires et contrat, avec seuils de couverture (TESTING §4.1)
        run: pnpm test:coverage
      - name: Sécurité de la base (PGlite)
        run: pnpm test:db
      # Banc des agents avec des fausses implémentations : aucun réseau, aucune clé, aucun coût (TESTING §6.1).
      - name: Banc des agents — tests du banc et rejeu des sorties enregistrées
        run: pnpm bench:test && pnpm bench:replay
      - name: Résumé de couverture dans la page de la tâche
        if: always()
        run: pnpm --silent coverage:summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: couverture
          path: '**/coverage/coverage-summary.json'
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Intégration (Supabase local)
    needs: gate
    # Ignoré pour un brouillon de pull request (économie de minutes), lancé dès qu'elle est prête.
    if: needs.gate.outputs.ready == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Démarrer Supabase (migrations appliquées)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Variables de test (clés locales, secrets aléatoires)
        run: pnpm ci:env >> "$GITHUB_ENV"
      - run: pnpm test:int
      - name: Chaque opération d'OpenAPI a ses 5 cas (TESTING §4.2)
        run: pnpm test:routes-coverage

  e2e:
    name: Parcours critiques P1 à P7
    needs: gate
    if: needs.gate.outputs.ready == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: pnpm ci:env >> "$GITHUB_ENV"
      - name: Installer Chromium pour Playwright
        run: pnpm --filter @pubeka/web exec playwright install --with-deps chromium
      - name: Construire, démarrer sur le port 5173, lancer P1 à P7 (390 et 1280 px)
        run: pnpm e2e:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: rapport-playwright
          path: apps/web/playwright-report
          retention-days: 14

  build:
    name: Build
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm ci:env >> "$GITHUB_ENV"
      - run: pnpm build

  ci-ok:
    name: CI terminée
    if: always()
    needs: [gate, quality, secrets, migrations-guard, unit, integration, e2e, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Aucun échec ni annulation
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              failure|cancelled) echo "::error::Au moins une étape de la CI a échoué ($RESULTS)."; exit 1 ;;
            esac
          done
          echo "Résultats : $RESULTS"
