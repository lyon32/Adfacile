# ═══════════════════════════════════════════════════════════════
# AdsFacile - Docker Compose PRODUCTION
# Lance avec: docker compose up -d
# ═══════════════════════════════════════════════════════════════

services:
  # ── Backend Node.js ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adsfacile-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - adsfacile-net

  # ── Frontend (Nginx) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adsfacile-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - adsfacile-net

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: adsfacile-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - adsfacile-net

volumes:
  redis-data:

networks:
  adsfacile-net:
    driver: bridge
